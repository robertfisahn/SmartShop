<div class="background">
    <div class="main">
        <p>Create an Account</p>
        <form (ngSubmit)="onRegister(registerForm)" #registerForm="ngForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" ngModel required email #email="ngModel"
                    [class.is-invalid]="email.invalid && registerForm.submitted">
                <div *ngIf="email.invalid && registerForm.submitted" class="invalid-feedback">
                    Please enter a valid email.
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" ngModel required minlength="6" #password="ngModel"
                    [class.is-invalid]="password.invalid && registerForm.submitted">
                <div *ngIf="password.invalid && registerForm.submitted" class="invalid-feedback">
                    Password must be at least 6 characters.
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" ngModel required
                    #confirmPassword="ngModel"
                    [class.is-invalid]="confirmPassword.value !== password.value && registerForm.submitted">
                <div *ngIf="confirmPassword.value !== password.value && registerForm.submitted"
                    class="invalid-feedback">
                    Passwords do not match.
                </div>
            </div>

            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" ngModel required #firstName="ngModel"
                    [class.is-invalid]="firstName.invalid && registerForm.submitted">
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" ngModel required #lastName="ngModel"
                    [class.is-invalid]="lastName.invalid && registerForm.submitted">
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" ngModel required #city="ngModel"
                    [class.is-invalid]="city.invalid && registerForm.submitted">
            </div>

            <div class="form-group">
                <label for="street">Street</label>
                <input type="text" id="street" name="street" ngModel required #street="ngModel"
                    [class.is-invalid]="street.invalid && registerForm.submitted">
            </div>

            <div class="form-group">
                <label for="postalCode">Postal Code</label>
                <input type="text" id="postalCode" name="postalCode" ngModel required #postalCode="ngModel"
                    [class.is-invalid]="postalCode.invalid && registerForm.submitted">
            </div>

            <button type="submit" class="btn-register">Register</button>
        </form>
    </div>
</div>
