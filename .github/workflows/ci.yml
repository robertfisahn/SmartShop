name: .NET CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "ci/**"
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK 
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run : dotnet restore
        
      - name: Build solution 
        run : dotnet build SmartShopAPI/SmartShopAPI/SmartShopAPI.csproj --no-restore

      - name: Set JWT_KEY env
        run: echo "Authentication__JwtKey=${{ secrets.JWT_KEY }}" >> $GITHUB_ENV

      - name: Run tests with coverage (IntegrationTest env)
        env : 
          ASPNETCORE_ENVIRONMENT: IntegrationTest
        run: dotnet test SmartShopAPI/SmartShopAPI.Tests/SmartShopAPI.Tests.csproj --verbosity normal --logger trx --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator "-reports:**/coverage.cobertura.xml" "-targetdir:coveragereport" "-reporttypes:Html;MarkdownSummary"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport

      - name: Show code coverage summary in GitHub Actions
        run: |
          echo "## 🧪 Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          cat coveragereport/Summary.md >> $GITHUB_STEP_SUMMARY
