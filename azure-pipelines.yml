trigger:
  branches:
    include:
      - master
      - feature/azure-pipelines

pool:
  name: Default

variables:
  - group: SmartShop-Env
  - name: buildConfiguration
    value: 'Release'
  - name: acrName
    value: 'smartshop.azurecr.io'
  - name: apiImageName
    value: 'smartshopapi'
  - name: uiImageName
    value: 'smartshopui'
  - name: tag
    value: '$(Build.BuildId)'

steps:
- checkout: self

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '9.0.x'
  displayName: 'Install .NET 9 SDK'

- script: |
    dotnet restore SmartShopAPI/SmartShopAPI/SmartShopAPI.csproj
    dotnet build SmartShopAPI/SmartShopAPI/SmartShopAPI.csproj --configuration $(buildConfiguration) --no-restore
  displayName: 'Build SmartShopAPI (.NET)'

- script: |
    dotnet test SmartShopAPI/SmartShopAPI.Tests/SmartShopAPI.Tests.csproj --configuration $(buildConfiguration) --verbosity normal
  displayName: 'Test SmartShopAPI'

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js 20.x'

- script: |
    cd SmartShopUI/SmartShopUI
    npm ci
    npm run build --if-present
  displayName: 'Build SmartShopUI (Angular)'

- task: AzureCLI@2
  inputs:
    azureSubscription: 'AzureConnection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az acr login --name smartshop
  displayName: 'Login to ACR'

- script: |
    docker build -t $(acrName)/$(apiImageName):$(tag) ./SmartShopAPI/SmartShopAPI
    docker build -t $(acrName)/$(uiImageName):$(tag) ./SmartShopUI/SmartShopUI
  displayName: 'Build Docker images'

- script: |
    docker push $(acrName)/$(apiImageName):$(tag)
    docker push $(acrName)/$(uiImageName):$(tag)
  displayName: 'Push Docker images to ACR'
