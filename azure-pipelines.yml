trigger:
  branches:
    include:
      - master
      - feature/azure-pipelines

pool:
  name: Default

variables:
  - group: SmartShop-Env
  - name: buildConfiguration
    value: 'Release'
  - name: acrName
    value: 'smartshop.azurecr.io'
  - name: apiImageName
    value: 'smartshopapi'
  - name: uiImageName
    value: 'smartshopui'
  - name: tag
    value: '$(Build.BuildId)'

steps:
- checkout: self

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '9.0.x'
  displayName: 'Install .NET 9 SDK'

- script: |
    dotnet restore SmartShopAPI/SmartShopAPI/SmartShopAPI.csproj
    dotnet build SmartShopAPI/SmartShopAPI/SmartShopAPI.csproj --configuration $(buildConfiguration) --no-restore
  displayName: 'Build SmartShopAPI (.NET)'

- script: |
    dotnet test SmartShopAPI/SmartShopAPI.Tests/SmartShopAPI.Tests.csproj --configuration $(buildConfiguration) --verbosity normal
  displayName: 'Test SmartShopAPI'

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js 20.x'

- script: |
    cd SmartShopUI/SmartShopUI
    npm ci
    npm run build --if-present
  displayName: 'Build SmartShopUI (Angular)'

- task: AzureCLI@2
  inputs:
    azureSubscription: 'AzureConnection'
    scriptType: 'pscore'
    scriptLocation: 'inlineScript'
    inlineScript: |
      Write-Host "Logging into Azure Container Registry..."
      $acrName = "smartshop"
      $acrUser = az acr credential show --name $acrName --query "username" -o tsv
      $acrPass = az acr credential show --name $acrName --query "passwords[0].value" -o tsv
      docker login $acrName.azurecr.io -u $acrUser -p $acrPass
  displayName: 'Login to ACR (direct Docker login)'

- script: |
    docker build -t smartshop.azurecr.io/smartshopapi:$(Build.BuildId) ./SmartShopAPI/SmartShopAPI
    docker build -t smartshop.azurecr.io/smartshopui:$(Build.BuildId) ./SmartShopUI/SmartShopUI
  displayName: 'Build Docker images'

- script: |
    docker push smartshop.azurecr.io/smartshopapi:$(Build.BuildId)
    docker push smartshop.azurecr.io/smartshopui:$(Build.BuildId)
  displayName: 'Push Docker images to ACR'

