trigger:
  branches:
    include:
      - master

pool:
  name: Default

variables:
  - group: SmartShop-Env
  - name: buildConfiguration
    value: 'Release'
  - name: acrServer
    value: 'acrsmartshop.azurecr.io'
  - name: apiImageName
    value: 'smartshopapi'
  - name: uiImageName
    value: 'smartshopui'
  - name: tag
    value: '$(Build.BuildId)'

steps:

- checkout: self

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '9.0.x'
  displayName: 'Install .NET 9 SDK'

- script: |
    dotnet restore SmartShopAPI/SmartShopAPI/SmartShopAPI.csproj
    dotnet build SmartShopAPI/SmartShopAPI/SmartShopAPI.csproj --configuration $(buildConfiguration) --no-restore
  displayName: 'Build API'

- script: |
    dotnet test SmartShopAPI/SmartShopAPI.Tests/SmartShopAPI.Tests.csproj --configuration $(buildConfiguration) --verbosity normal
  displayName: 'Test API'

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    cd SmartShopUI/SmartShopUI
    npm ci
    npm run build --if-present
  displayName: 'Build UI'

- task: AzureCLI@2
  inputs:
    azureSubscription: 'AzureConnection'
    scriptType: 'pscore'
    scriptLocation: 'inlineScript'
    inlineScript: |
      docker login $(acrServer) --username $(DOCKER_REGISTRY_SERVER_USERNAME) --password $(DOCKER_REGISTRY_SERVER_PASSWORD)
  displayName: 'Login to ACR'

- script: |
    docker build -t $(acrServer)/$(apiImageName):$(tag) ./SmartShopAPI/SmartShopAPI
    docker build \
      --build-arg API_URL=$(API_URL) \
      -t $(acrServer)/$(uiImageName):$(tag) \
      ./SmartShopUI/SmartShopUI
  displayName: 'Build Docker Images'

- script: |
    docker push $(acrServer)/$(apiImageName):$(tag)
    docker push $(acrServer)/$(uiImageName):$(tag)
  displayName: 'Push Docker Images'

- task: AzureWebAppContainer@1
  inputs:
    azureSubscription: 'AzureConnection'
    appName: 'smartshop-api'
    imageName: '$(acrServer)/$(apiImageName):$(tag)'
  displayName: 'Deploy API'

- task: AzureWebAppContainer@1
  inputs:
    azureSubscription: 'AzureConnection'
    appName: 'smartshop-ui'
    imageName: '$(acrServer)/$(uiImageName):$(tag)'
  displayName: 'Deploy UI'
